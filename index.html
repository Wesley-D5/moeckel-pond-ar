<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f3eb" />
    <meta name="color-scheme" content="light" />
    <title>Moeckel Pond · Wall film and miniature</title>
    <meta
      name="description"
      content="Place the original Moeckel Pond film on your wall or explore a miniature of the mill."
    />
    <meta property="og:title" content="Moeckel Pond" />
    <meta
      property="og:description"
      content="The wall film and the miniature."
    />
    <meta
      property="og:image"
      content="https://wesley-d5.github.io/moeckel-pond-ar/assets/poster.jpg"
    />
    <link rel="icon" href="./pond-mark.svg" />
    <link rel="stylesheet" href="./pond.css" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./fonts/instrument-serif.woff2"
    />
  </head>
  <body>
    <main class="exhibition">
      <header class="masthead">
        <h1>
          <img src="./pond-mark.svg" width="39" height="39" alt="" />Moeckel
          Pond
        </h1>
        <div class="choice" role="group" aria-label="Choose artwork">
          <button id="select-wall" type="button" aria-pressed="true">
            Wall film
          </button>
          <button id="select-miniature" type="button" aria-pressed="false">
            Miniature
          </button>
        </div>
      </header>

      <figure class="work" id="work">
        <div class="studio" id="stage">
          <div class="framed-film" id="film-picture">
            <img
              src="./assets/poster.jpg"
              width="1920"
              height="1080"
              fetchpriority="high"
              alt="Two dark wooden mill buildings stand on stone piers above the pond."
            />
          </div>
          <div class="sculpture" id="model-picture" hidden>
            <img
              id="model-poster"
              alt="Miniature of the mill, its left-bank stone wall, and its long grassy island."
              width="1080"
              height="720"
            />
            <div id="orbit" class="orbit"></div>
          </div>
        </div>
        <figcaption class="caption">
          <div>
            <h2 id="piece-title">The wall film</h2>
            <p id="piece-detail">41 seconds · Original soundtrack</p>
          </div>
          <div class="launch-wrap">
            <div class="native-button" id="native-button">
              <a
                id="native-launch"
                rel="ar"
                href="./models/moeckel-wall-film-whole.usdz"
                aria-label="Place on wall"
                ><img id="native-image" src="./assets/poster.jpg" alt=""
              /></a>
              <span id="native-label">Place on wall</span
              ><span class="north-arrow" aria-hidden="true">↗</span>
            </div>
            <button id="launch" class="launch" type="button" hidden>
              <span id="launch-label">Place on wall</span
              ><span class="north-arrow" aria-hidden="true">↗</span>
            </button>
            <p id="error" class="error" role="alert" hidden></p>
          </div>
        </figcaption>
      </figure>
      <noscript
        ><p>
          Open this page in Safari on iPhone or iPad and tap Place on wall.
          <a rel="ar" href="./models/moeckel-mill.usdz"
            ><img
              src="./pond-mark.svg"
              width="28"
              height="28"
              alt="Place the miniature"
          /></a></p
      ></noscript>
    </main>
    <dialog id="handoff" aria-labelledby="handoff-title">
      <button id="dismiss" type="button" aria-label="Close">×</button>
      <h2 id="handoff-title">Open on your phone</h2>
      <p id="handoff-detail">
        Scan the code with your phone camera to place the film.
      </p>
      <img
        id="qr"
        width="176"
        height="176"
        alt="QR code opening the selected artwork"
      />
    </dialog>
    <script type="module" src="./pond.js?v=native-wall"></script>
  </body>
</html>
