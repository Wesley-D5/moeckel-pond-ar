<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compile image target</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  img { max-width: 100%; border: 1px solid #ccc; }
  #status { font-weight: 600; }
</style>
</head>
<body>
<h1>Compile image target</h1>
<p>Only needed if you change the poster image. Builds <code>assets/target.mind</code> from
<code>assets/target.jpg</code> (or an image you pick), then downloads it. Put the downloaded file in
<code>assets/</code>, replacing the old one.</p>
<p><input type="file" id="file" accept="image/*"> or <button id="useDefault">Use assets/target.jpg</button></p>
<p id="status">Waiting…</p>
<img id="preview" alt="">
<script type="module">
import { Compiler } from '../vendor/mindar/mindar-image.prod.js';

const status = document.getElementById('status');
const preview = document.getElementById('preview');

async function compile(src) {
  preview.src = src;
  await preview.decode();
  const compiler = new Compiler();
  status.textContent = 'Compiling… 0%';
  await compiler.compileImageTargets([preview], (p) => {
    status.textContent = `Compiling… ${p.toFixed(0)}%`;
  });
  const data = await compiler.exportData();
  const blob = new Blob([data], { type: 'application/octet-stream' });

  // When run with the local helper server, save straight into assets/.
  try {
    const r = await fetch('/__save-target', { method: 'POST', body: blob });
    if (r.ok) { status.textContent = `Done: saved assets/target.mind (${blob.size} bytes)`; window.__done = true; return; }
  } catch (_) { /* no helper server: fall back to download */ }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'target.mind';
  a.click();
  status.textContent = `Done: downloaded target.mind (${blob.size} bytes)`;
  window.__done = true;
}

document.getElementById('useDefault').onclick = () => compile('../assets/target.jpg');
document.getElementById('file').onchange = (e) => {
  const f = e.target.files[0];
  if (f) compile(URL.createObjectURL(f));
};
if (location.hash === '#auto') compile('../assets/target.jpg');
</script>
</body>
</html>
